<!doctype html>
<!-- Umbraflow loading screen. Created by Big_Killers. -->
<html>
<head>
    <meta charset="utf-8" />
    <title>Loading...</title>
    <link rel="stylesheet" type="text/css" href="loading.css" />
</head>
<body>
    <div id="background">
        <div id="container">
            <img id="logo" src="img/umbraflow_eclipse.png" alt="Umbraflow" />
            <div class="walk" aria-hidden="true">:v</div>
            <div id="loading-status" role="status" aria-live="polite">Loading...</div>
        </div>
        <div class="server_info">
            <img id="mapimg" alt="" />
            <div class="text">
                <div id="serverName"></div>
                <div id="serverMap"></div>
                <div id="serverGamemode"></div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        var serverName = document.getElementById( 'serverName' );
        var serverMap = document.getElementById( 'serverMap' );
        var serverGamemode = document.getElementById( 'serverGamemode' );
        var mapImage = document.getElementById( 'mapimg' );
        var loadingStatus = document.getElementById( 'loading-status' );

        mapImage.onerror = function() {
            mapImage.style.visibility = 'hidden';
            document.body.style.backgroundImage = 'none';
        };
        mapImage.onload = function() { mapImage.style.visibility = 'visible'; };

        function GameDetails( servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, lang, gamemodeNice )
        {
            serverName.textContent = servername || '';
            serverMap.textContent = mapname || '';
            serverGamemode.textContent = gamemodeNice || gamemode || '';
            var mapUrl = 'asset://mapimage/' + encodeURIComponent( mapname || '' ).replace( /'/g, '%27' );
            mapImage.style.visibility = 'hidden';
            mapImage.src = mapUrl;
            document.body.style.backgroundImage = 'url("' + mapUrl + '")';
            document.querySelector( '.server_info' ).classList.add( 'visible' );
        }

        function DownloadingFile( file )
        {
            loadingStatus.textContent = file ? 'Downloading ' + file : 'Downloading...';
        }

        function SetStatusChanged( status )
        {
            loadingStatus.textContent = status || 'Loading...';
        }
    </script>
</body>
</html>
